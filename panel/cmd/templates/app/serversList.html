{{define "content"}}
    <style>
        #bigDiv {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin: 1.5rem;
        }
        .server {
            display: grid;
        }
        button.stop {
            background-color: #D93526 !important;
            border-color: #D93526 !important;
            width: auto;
        }
        button.stop:hover {
            background-color: #EE402E !important;
            border-color: #EE402E !important;
        }
        button.restart {
            background-color: #D8A100 !important;
            border-color: #D8A100 !important;
        }
        button.restart:hover {
            background-color: #FECC63 !important;
            border-color: #FECC63 !important;
        }
        button.start:hover {
            background-color: #55C21E !important;
            border-color: #55C21E !important;
        }
        button.start {
            background-color: #398712 !important;
            border-color: #398712 !important;
            width: auto;
        }
        .smallDiv {
            display: flex;
            justify-content: flex-start;
            gap: .5rem;
            grid-column-start: 2;
            grid-column-end: 2;
        }
        div.serverGrid {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: start;
            background-color: #232837;
            padding: 20px;
            border-radius: 10px;
        }
        .textDiv {
            grid-column-start: 1;
            grid-column-end: 1;
            margin: 0;
        }
    </style>
    <div id="bigDiv">
        {{range .servers}}
        <div class="server">
            <div class="serverGrid">
                    <p class="textDiv">
                        <strong>{{.Name}}</strong>
                    </p>

                    <div class="smallDiv">
                        <button type="submit" class="start">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-play" viewBox="0 0 16 16">
                                <path d="M10.804 8 5 4.633v6.734zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696z"/>
                            </svg>
                        </button>
                        <button type="submit" class="restart">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                                <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                            </svg>
                        </button>
                        <button type="submit" class="stop">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-power" viewBox="0 0 16 16">
                                <path d="M7.5 1v7h1V1z"/>
                                <path d="M3 8.812a5 5 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812"/>
                            </svg>
                        </button>
                    </div>
            </div>
        </div>


        {{end}}
    </div>
{{end}}
