{{define "content"}}
    <style>
        #bigDiv {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin: 1.5rem;
        }
        .server {
            display: block;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            border: 0 solid white;
            border-right: 10px;
            box-shadow: 0 0 6px rgba(255,255,255,0.65);

        }
        .server:hover {
            transform: scale(1.02);
        }
        .server button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 2rem;
        }
        .server button svg {
            display: block;
            flex-shrink: 0;
        }
        div.serverGrid {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: start;
            background-color: #2B3035;
            padding: 20px;
            border-radius: 10px;
        }
        .textDiv {
            grid-column-start: 1;
            grid-column-end: 1;
            margin: 0;
        }
        div.statsWrap {
            grid-column: 1/-1;
        }
    </style>
    <div id="bigDiv">
        {{range .servers}}
        <a class="server" href="/server?uuid={{.ServerId}}">
            <div class="serverGrid">
                <p class="textDiv">
                    <strong>{{.Name}}</strong>
                </p>
                <div class="btn-group" role="group">
                    <button type="submit" class="btn btn-outline-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play preview-icon"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
                    </button>
                    <button type="submit" class="btn btn-outline-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw preview-icon"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                    <button type="submit" class="btn btn-outline-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-power preview-icon"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
                    </button>
                </div>
                <div class="statsWrap">
                    <p style="text-align: left">{{.Node.IpAddress}}</p>
                    <p>{{.RamMb}} MB | {{.CpuLimit}} | {{.DiskMb}} MB</p>
                </div>
            </div>
        </a>
        {{end}}
    </div>
{{end}}
