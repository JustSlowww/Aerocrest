<!DOCTYPE html>
<html lang="en">
<link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.min.css">
<style>
    main.container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;
    }
    label.signup {
        justify-content: left;
    }
    h1.title {
        margin-bottom: 6rem;
    }
    .rounded {
        border-radius: 0.7rem !important;
    }
</style>
<head>
    <meta charset="UTF-8">
    <title>Aerocrest panel</title>
</head>
<body class="pico">

<main class="container">
    <h1 class="title">Aerocrest Panel</h1>
    <form action="/login" method="POST">
        <fieldset>
            <label>
                Username
                <input class="rounded" name="username" placeholder="Username"/>
            </label>
            <label>
                Password
                <input class="rounded" name="password" placeholder="Password"/>
            </label>
        </fieldset>
        <input class="rounded" type="submit" value="Login"/>
        <a class="signup" href="/signup">Sign-Up</a>
    </form>
</main>
</body>
</html>
