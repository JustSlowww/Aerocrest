    <style>
        main.container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-color: white;
            border-style: solid;
            width: fit-content;
            padding: 25px;
            border-radius: 1rem;
            box-shadow: 0 2px 8px 1px rgba(255, 255, 255, 0.15);
            padding-top: 0;
        }
        h1.title {
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        form {
            width: 100%;
            max-width: 50rem;
            min-width: 0;
        }
        p.color {
            color: red;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        div.coolDiv {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        div.betterdiv {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body style="user-select: none;">
<div class="coolDiv">
    <main class="container">
        <div class="betterdiv">
            <h1 class="title">Aerocrest Panel</h1>
        </div>
        <form action="/login" method="POST">
            <fieldset>
                <div class="mb-7">
                    <label for="username" class="form-label">Username</label>
                    <input class="form-control" name="username" placeholder="Username" autocomplete="username" maxlength="64" id="username" required/>
                </div>
                <div class="mb-7">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter password" id="password" autocomplete="current-password" maxlength="72" required/>
                    <div class="strength-bar" data-bs-strength></div>
                </div>
            </fieldset>
            <div class="d-flex flex-column">
                <button type="submit" class="btn-outline theme-primary mb-2">Login</button>
                <a type="button" href="/signup" class="theme-primary" style="text-decoration: none;">Sign-up</a>
            </div>
            {{ if .ShowError}}
            <p class="color">{{ .ErrorMsg }}</p>
            {{ end }}
        </form>
    </main>
</div>

<script>
    if (window.location.search.includes("error=")) {
        window.history.replaceState({}, document.title, window.location.pathname);
    }
</script>
</body>
</html>
