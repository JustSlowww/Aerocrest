<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aerocrest panel - Sign-in</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.min.css">
    <style>
        main.container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-color: white;
            border-style: solid;
            width: fit-content;
            padding: 25px;
            border-radius: 1rem;
            box-shadow: 0 4px 16px 2px rgba(255, 255, 255, 0.15);
            transition: box-shadow 0.3s ease-in-out;
            padding-top: 0;
        }
        main.container:hover {
            box-shadow: 0 4px 16px 2px rgba(255, 255, 255, 0.3);
        }
        h1.title {
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .rounded {
            border-radius: 0.7rem !important;
        }
        form {
            width: 100%;
            max-width: 400px;
            min-width: 0;
        }
        p.color {
            color: red;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        div.coolDiv {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

        }
        div.betterdiv {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body class="pico">
<div class="coolDiv">
    <main class="container">
        <div class="betterdiv">
            <h1 class="title">Aerocrest Panel</h1>
        </div>
        <form action="/login" method="POST">
            <fieldset>
                <label>
                    Username
                    <input class="rounded" name="username" placeholder="Username" autocomplete="username" maxlength="64" required/>
                </label>
                <label>
                    Password
                    <input type="password" class="rounded" name="password" placeholder="Password" autocomplete="current-password" maxlength="72" required/>
                </label>
            </fieldset>
            <input class="rounded" type="submit" value="Login"/>
            <a class="signup" href="/signup">Sign-Up</a>
            {{ if .ShowError}}
            <p class="color">{{ .ErrorMsg }}</p>
            {{ end }}
        </form>
    </main>
</div>

<script>
    if (window.location.search.includes("error=")) {
        window.history.replaceState({}, document.title, window.location.pathname);
    }
</script>
</body>
</html>
